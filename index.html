<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="description" content="学習を記録して、そのまま一問一答に" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="StudyRecall" />
    <title>StudyRecall — 学習記録と一問一答</title>
    <script>
      // React が動く前にテーマを当てる。これが無いと、ダーク設定でも
      // 一瞬だけ白い画面が出て目に刺さる（FOUC）。
      // 判定は src/client/lib/theme.ts の resolveTheme と同じ規則。
      (function () {
        try {
          var saved = localStorage.getItem('studyrecall:theme');
          var dark =
            saved === 'dark' ||
            ((saved === 'system' || saved === null) &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) {
            document.documentElement.classList.add('dark');
            document.querySelector('meta[name="theme-color"]').setAttribute('content', '#020617');
          }
        } catch (e) {
          // localStorage が読めない環境ではライトのまま進める
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
